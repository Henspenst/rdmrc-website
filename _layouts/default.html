<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description }}" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>
  <body>

    <!-- Navigation & Header Bar -->
    <div class="mrc-header">
      <img src="{{ '/images/logo.jpg' | relative_url }}" alt="MRC Logo" class="mrc-logo">

      <!-- Hidden checkbox for mobile toggle -->
      <input type="checkbox" id="menu-toggle" class="menu-checkbox">
      
      <!-- Hamburger Icon -->
      <label for="menu-toggle" class="hamburger-icon">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <!-- Button Links -->
      <div class="mrc-button-row">
        <a href="{{ '/' | relative_url }}" class="mrc-btn">Home</a>
        <a href="{{ '/membership/' | relative_url }}" class="mrc-btn">Membership</a>
        <a href="{{ '/layouts/' | relative_url }}" class="mrc-btn">Layouts</a>
        <a href="{{ '/events/' | relative_url }}" class="mrc-btn">Events</a>
      </div>
    </div>

    <!-- MAIN CENTERED COLUMN WRAPPER -->
    <div class="page-container">
      {{ content }}
    </div>
    
    <footer class="footer">
    <p> Email - email@email.com</p>
    <p> Phone - 07966154977</p>
    <p><a href="https://www.facebook.com/groups/304517475303482/" target="_blank" rel="noopener">Facebook</a>.</p>
    </footer>
    
  </body>
</html>
